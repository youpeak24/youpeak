name: YouPeak - Auto Deploy to Firebase

on:
  push:
    branches:
      - main
      - master

jobs:
  # ============================================================
  # JOB 1: Admin Panel Build & Deploy
  # ============================================================
  deploy_admin:
    name: Build & Deploy Admin Panel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Admin Dependencies & Build
        run: |
          cd admin/frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Deploy Admin to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: youpeak-9ff65
          target: admin

  # ============================================================
  # JOB 2: Flutter Web App Build & Deploy
  # ============================================================
  deploy_app:
    name: Build & Deploy Flutter Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Flutter Build Web
        run: |
          cd metube
          flutter pub get
          flutter build web --release

      - name: Deploy Flutter App to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: youpeak-9ff65
          target: app
